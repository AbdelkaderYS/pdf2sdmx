[project]
name = "pdf2sdmx"
version = "0.1.0"
description = "Turn tables printed in INS Niger PDF reports into validated SDMX data."
requires-python = ">=3.11,<3.14"

dependencies = [
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "camelot-py>=2.0",
    "sdmx1>=2.20",
    "rapidfuzz>=3.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "gradio>=5.0",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
ml = ["camelot-py[ml]>=2.0", "torch>=2.2", "transformers>=4.40"]
vision = ["docling>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.3", "httpx>=0.27", "reportlab>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2sdmx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
