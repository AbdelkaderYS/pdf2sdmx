name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The text stage only. Torch is 738 MB and the vision stage is optional, so what
      # runs here is what a free host runs, which is the point of checking it.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Format
        run: ruff format --check src tests scripts

      - name: Test
        run: pytest -q
